    .btn{background:rgba(42,159,214,.1);border:1px solid rgba(42,159,214,.25);color:#aaa;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}

    .controls-label{font-size:.78rem;color:#666;white-space:nowrap}

    .card-sub{font-size:.75rem;color:#555;margin-top:3px;display:block}

</head>

  // ── Nyx ────────────────────────────────────────────────────────────────────
  {n:'Glaciem Ring',     sys:'Nyx', type:'Belt',
   ship:{Torite:29,Ice:21,Iron:21,Bexalite:18,Borase:18,Gold:18,Lindinium:10,Tungsten:10,Savrilium:2}},
  {n:'Keeger Belt',      sys:'Nyx', type:'Belt',
   ship:{Torite:29,Aluminium:21,Corundum:21,Ice:21,Bexalite:18,Borase:18,Gold:18,Lindinium:10,Tungsten:10,Savrilium:2}},
  {n:'Breaker Geodes',   sys:'Nyx', type:'Belt',
   ship:{Savrilium:100,Torite:100}},
  {n:'Breaker Interior', sys:'Nyx', type:'Cave',
   fps:{Aphorite:75,Sadaryx:25}},
];

const ALL_ORES = [...new Set(
  LOCATIONS.flatMap(l => ['ship','roc','fps'].flatMap(m => Object.keys(l[m]||{})))
)].sort();

document.getElementById('stat-locs').textContent = LOCATIONS.length;
document.getElementById('stat-ores').textContent = ALL_ORES.length;

// ore index: ore -> [{loc, pct, method}] sorted by pct desc
const ORE_INDEX = {};
ALL_ORES.forEach(ore => {
  ORE_INDEX[ore] = [];
  LOCATIONS.forEach(loc => {
    ['ship','roc','fps'].forEach(method => {
      if (loc[method] && loc[method][ore] !== undefined) {
        ORE_INDEX[ore].push({loc, pct: loc[method][ore], method});
      }
    });
  });
  ORE_INDEX[ore].sort((a,b) => b.pct - a.pct);
});

let currentSys = 'All';
let currentMethod = 'All';
let currentView = 'location';
let searchQ = '';
let hideBelts = true;

function locMatchesMethod(loc) {
  if (currentMethod === 'All') return true;
  return !!loc[currentMethod];
}

const SYS_COLOR = {
  Stanton: { bar: 'linear-gradient(90deg,#1a6090,#4fc3f7)', text: '#4fc3f7' },
  Pyro:    { bar: 'linear-gradient(90deg,#a04020,#ff9060)', text: '#ff9060' },
  Nyx:     { bar: 'linear-gradient(90deg,#602090,#c080ff)', text: '#c080ff' },
};

function oreDominantMethod(oreName) {
  const entries = ORE_INDEX[oreName] || [];
  if (!entries.length) return 'ship';
  const counts = {ship:0, roc:0, fps:0};
  entries.forEach(e => counts[e.method]++);
  return Object.entries(counts).sort((a,b) => b[1]-a[1])[0][0];
}

function oreColors(oreName) {
  return METHOD[oreDominantMethod(oreName)];
}

function renderByLocation(locs) {
  if (!locs.length) return '<div class="no-results">No locations match your filter.</div>';
  const activeMethods = currentMethod === 'All' ? ['ship','roc','fps'] : [currentMethod];
  return '<div class="cards-grid">' + locs.map(loc => {
    // collect all ores across active methods, compute per-method max for bar scaling
    const methodMax = {};
    activeMethods.forEach(m => {
      if (!loc[m]) return;
      methodMax[m] = Math.max(...Object.values(loc[m]));
    });
    const allEntries = [];
    activeMethods.forEach(method => {
      if (!loc[method]) return;
      Object.entries(loc[method]).forEach(([ore, pct]) => allEntries.push({ore, pct, method}));
    });
    allEntries.sort((a,b) => b.pct - a.pct);
    const oreRows = allEntries.map(({ore, pct, method}) => {
      const mc = METHOD[method];
      const w = Math.round(pct / methodMax[method] * 100);
      return `<div class="ore-row">
        <span class="ore-name" style="color:${mc.text}" title="${ore}">${ore}</span>
        <div class="ore-bar-wrap"><div class="ore-bar" style="width:${w}%;background:${mc.bar}"></div></div>
        <span class="ore-pct" style="color:${mc.text}">${pct}%</span>
      </div>`;
    }).join('');
    const sub = [loc.type, loc.sys, loc.b].filter(Boolean).join(' · ');
    return `<div class="card">
      <div class="card-header">
        <span class="card-name">${loc.n}</span>
        <span class="card-sub">${sub}</span>
      </div>
      ${oreRows}
    </div>`;
  }).join('') + '</div>';
}

function renderByOre(ores) {
  if (!ores.length) return '<div class="no-results">No ores match your filter.</div>';
  return ores.map(ore => {
    const entries = ORE_INDEX[ore].filter(e =>
      (currentSys === 'All' || e.loc.sys === currentSys) &&
      (currentMethod === 'All' || e.method === currentMethod)
    );
    if (!entries.length) return '';
    const maxPct = entries[0].pct;
    const dominant = oreDominantMethod(ore);
    const nameCol = METHOD[dominant].text;
    const methodTag = {ship:'Ship',roc:'Ground',fps:'FPS'}[dominant];
    const rows = entries.map(e => {
      const w = Math.round(e.pct / maxPct * 100);
      const sc = SYS_COLOR[e.loc.sys] || SYS_COLOR.Stanton;
      const locMain = [e.loc.sys, e.loc.n].filter(Boolean).join(' · ');
      const locSub = [e.loc.b, e.loc.type].filter(Boolean).join(' · ');
      return `<tr>
        <td class="td-loc">${locMain}<span class="td-body">${locSub}</span></td>
        <td class="td-bar-cell"><div style="background:rgba(255,255,255,.06);border-radius:4px;height:10px;overflow:hidden"><div class="inline-bar" style="width:${w}%;background:${sc.bar}"></div></div></td>
        <td class="td-pct" style="color:${sc.text}">${e.pct}%</td>
      </tr>`;
    }).join('');
    return `<div class="ore-section">
      <div class="ore-section-header">
        <span class="ore-section-name" style="color:${nameCol}">${ore}</span>
        <span style="font-size:.72rem;color:${nameCol};opacity:.75;margin-left:6px">${methodTag}</span>
        <span class="ore-count">${entries.length} location${entries.length!==1?'s':''}</span>
      </div>
      <table class="ore-table">
        <thead><tr>
          <th>Location</th><th style="width:120px">Spawn</th><th style="text-align:right">%</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).filter(Boolean).join('');
}

function getFilteredLocs() {
  const q = searchQ.toLowerCase();
  const methods = currentMethod === 'All' ? ['ship','roc','fps'] : [currentMethod];
  return LOCATIONS.filter(l => {
    if (currentSys !== 'All' && l.sys !== currentSys) return false;
    if (hideBelts && l.type === 'Belt') return false;
    if (!locMatchesMethod(l)) return false;
    if (!q) return true;
    if (l.n.toLowerCase().includes(q)) return true;
    return methods.some(m => l[m] && Object.keys(l[m]).some(o => o.toLowerCase().includes(q)));
  });
}

function getFilteredOres() {
  const q = searchQ.toLowerCase();
  return ALL_ORES.filter(ore => {
    const hasMatch = ORE_INDEX[ore].some(e =>
      (currentSys === 'All' || e.loc.sys === currentSys) &&
      (currentMethod === 'All' || e.method === currentMethod)
    );
    if (!hasMatch) return false;
    if (q && !ore.toLowerCase().includes(q)) {
      return ORE_INDEX[ore].some(e =>
        (currentSys === 'All' || e.loc.sys === currentSys) &&
        (currentMethod === 'All' || e.method === currentMethod) &&
        e.loc.n.toLowerCase().includes(q)
      );
    }
    return true;
  });
}

function render() {
  const content = document.getElementById('content');
  content.innerHTML = currentView === 'location'
    ? renderByLocation(getFilteredLocs())
    : renderByOre(getFilteredOres());
}

document.getElementById('hide-belts-btn').addEventListener('click', function() {
  hideBelts = !hideBelts;
  this.classList.toggle('active', hideBelts);
  this.textContent = hideBelts ? 'Show Belts' : 'Hide Belts';
  render();
});

document.getElementById('sys-tabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-sys]');
  if (!btn) return;
  currentSys = btn.dataset.sys;
  document.querySelectorAll('[data-sys]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('method-tabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-method]');
  if (!btn) return;
  currentMethod = btn.dataset.method;
  document.querySelectorAll('[data-method]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('view-tabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-view]');
  if (!btn) return;
  currentView = btn.dataset.view;
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  render();
});

render();
</script>
</body>
</html>
