<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mining Data — Star Citizen Pages</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⛏️%3C/text%3E%3C/svg%3E">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:linear-gradient(135deg,#0a0e27 0%,#1a1f3a 100%);color:#e8e8e8;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh}
    header{background:rgba(10,14,39,.8);backdrop-filter:blur(10px);border-bottom:2px solid #2a9fd6;padding:20px 0;margin-bottom:30px;box-shadow:0 4px 6px rgba(0,0,0,.3)}
    h1{color:#fff;font-size:2rem;font-weight:600;text-align:center;text-shadow:0 0 20px rgba(42,159,214,.5)}
    .subtitle{text-align:center;color:#a0a0a0;font-size:.9rem;margin-top:8px}
    .container{max-width:1400px;margin:0 auto;padding:0 20px 40px}

    /* stats */
    .stats{display:flex;gap:16px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
    .stat{background:rgba(42,159,214,.08);border:1px solid rgba(42,159,214,.2);border-radius:6px;padding:8px 20px;text-align:center}
    .stat-val{font-size:1.4rem;font-weight:700;color:#2a9fd6}
    .stat-lbl{font-size:.75rem;color:#888;margin-top:2px}

    /* controls */
    .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px;background:rgba(20,25,45,.6);padding:14px 18px;border-radius:10px}
    .btn-group{display:flex;gap:4px}
    .btn{background:rgba(42,159,214,.1);border:1px solid rgba(42,159,214,.25);color:#aaa;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}
    .btn:hover{background:rgba(42,159,214,.2);color:#e8e8e8}
    .btn.active{background:rgba(42,159,214,.35);border-color:#2a9fd6;color:#fff;font-weight:600}
    .search-wrap{flex:1;min-width:180px}
    .search-wrap input{width:100%;background:rgba(10,14,39,.6);border:1px solid rgba(42,159,214,.25);color:#e8e8e8;padding:6px 12px;border-radius:6px;font-size:.85rem;outline:none}
    .search-wrap input::placeholder{color:#555}
    .search-wrap input:focus{border-color:#2a9fd6}
    .controls-label{font-size:.78rem;color:#666;white-space:nowrap}

    /* location cards grid */
    .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
    .card{background:rgba(20,25,45,.6);border:1px solid rgba(42,159,214,.15);border-radius:10px;padding:16px;transition:border-color .2s}
    .card:hover{border-color:rgba(42,159,214,.4)}
    .card-header{margin-bottom:10px}
    .card-name{font-size:1rem;font-weight:600;color:#e8e8e8;display:block}
    .card-sub{font-size:.75rem;color:#555;margin-top:3px;display:block}
    .badge{font-size:.7rem;padding:2px 7px;border-radius:4px;font-weight:600;white-space:nowrap}
    .badge-stanton{background:rgba(42,159,214,.2);color:#4fc3f7;border:1px solid rgba(42,159,214,.3)}
    .badge-pyro{background:rgba(255,120,50,.2);color:#ff9060;border:1px solid rgba(255,120,50,.3)}
    .badge-nyx{background:rgba(160,90,220,.2);color:#c080ff;border:1px solid rgba(160,90,220,.3)}

    /* ore rows in card */
    .ore-row{display:flex;align-items:center;gap:8px;padding:3px 0}
    .ore-name{font-size:.82rem;width:110px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ore-bar-wrap{flex:1;background:rgba(255,255,255,.06);border-radius:3px;height:8px;overflow:hidden}
    .ore-bar{height:100%;border-radius:3px;transition:width .3s}
    .ore-pct{font-size:.8rem;width:36px;text-align:right;flex-shrink:0}

    /* by-ore view */
    .ore-section{background:rgba(20,25,45,.6);border:1px solid rgba(42,159,214,.15);border-radius:10px;margin-bottom:16px;overflow:hidden}
    .ore-section-header{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(42,159,214,.07);border-bottom:1px solid rgba(42,159,214,.12);cursor:pointer;user-select:none}
    .ore-section-name{font-size:1rem;font-weight:600}
    .ore-count{font-size:.78rem;color:#666;margin-left:auto}
    .ore-table{width:100%;border-collapse:collapse}
    .ore-table th{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:#666;padding:8px 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05)}
    .ore-table td{padding:7px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.85rem}
    .ore-table tr:last-child td{border-bottom:none}
    .ore-table tr:hover td{background:rgba(42,159,214,.05)}
    .td-loc{font-weight:500;color:#e8e8e8}
    .td-body{display:block;font-size:.72rem;color:#555;margin-top:1px}
    .td-sys{font-size:.78rem}
    .td-type{font-size:.78rem;color:#888}
    .method-badges{display:flex;gap:4px;flex-wrap:wrap}
    .mbadge{font-size:.68rem;padding:2px 6px;border-radius:4px;font-weight:600;white-space:nowrap}
    .mbadge-ship{background:rgba(42,159,214,.2);color:#4fc3f7;border:1px solid rgba(42,159,214,.3)}
    .mbadge-roc{background:rgba(80,200,80,.15);color:#70d070;border:1px solid rgba(80,200,80,.3)}
    .mbadge-hand{background:rgba(220,160,50,.15);color:#e0a030;border:1px solid rgba(220,160,50,.3)}
    .td-pct{font-weight:700;text-align:right}
    .td-bar-cell{width:120px}
    .inline-bar{height:10px;border-radius:3px;display:block}

    /* no results */
    .no-results{text-align:center;color:#555;padding:60px 20px;font-size:1rem}

    .footer{margin-top:40px;padding:20px 0;border-top:1px solid rgba(42,159,214,.3);color:#666;font-size:.82rem;text-align:center}
    .footer a{color:#2a9fd6;text-decoration:none}
    .footer a:hover{color:#4fc3f7;text-decoration:underline}

    @media(max-width:600px){
      .cards-grid{grid-template-columns:1fr}
      .controls{flex-direction:column;align-items:stretch}
    }
  </style>
</head>
<body>
<header>
  <div class="container">
    <h1>⛏️ Mining Data</h1>
    <div class="subtitle">Star Citizen · Ore Locations &amp; Spawn Percentages · Stanton, Pyro, Nyx</div>
  </div>
</header>

<div class="container">
  <div class="stats">
    <div class="stat"><div class="stat-val" id="stat-locs">—</div><div class="stat-lbl">Locations</div></div>
    <div class="stat"><div class="stat-val" id="stat-ores">—</div><div class="stat-lbl">Ore Types</div></div>
    <div class="stat"><div class="stat-val">3</div><div class="stat-lbl">Systems</div></div>
  </div>

  <div class="controls">
    <span class="controls-label">System:</span>
    <div class="btn-group" id="sys-tabs">
      <button class="btn active" data-sys="All">All</button>
      <button class="btn" data-sys="Stanton">Stanton</button>
      <button class="btn" data-sys="Pyro">Pyro</button>
      <button class="btn" data-sys="Nyx">Nyx</button>
    </div>
    <span class="controls-label" style="margin-left:8px">Method:</span>
    <div class="btn-group" id="method-tabs">
      <button class="btn active" data-method="All">All</button>
      <button class="btn" data-method="ship">Ship</button>
      <button class="btn" data-method="ground">ROC</button>
      <button class="btn" data-method="fps">FPS</button>
    </div>
    <span class="controls-label" style="margin-left:8px">View:</span>
    <div class="btn-group" id="view-tabs">
      <button class="btn active" data-view="location">By Location</button>
      <button class="btn" data-view="ore">By Ore</button>
    </div>
    <div class="search-wrap">
      <input type="search" id="search" placeholder="Filter location or ore…"/>
    </div>
  </div>

  <div id="content"></div>

  <div class="footer">
    Data sourced from <a href="https://scminer.rocks" target="_blank">SCMiner.rocks</a> and <a href="https://starcitizen.tools" target="_blank">starcitizen.tools</a> &nbsp;·&nbsp;
    <a href="/">← Back to Star Citizen Pages</a>
  </div>
</div>

<script>

// derived: all ore names
const ALL_ORES = [...new Set(LOCATIONS.flatMap(l => Object.keys(l.ores)))].sort();
document.getElementById('stat-locs').textContent = LOCATIONS.length;
document.getElementById('stat-ores').textContent = ALL_ORES.length;

// ore index: ore -> [{loc, pct}] sorted desc
const ORE_INDEX = {};
ALL_ORES.forEach(ore => {
  ORE_INDEX[ore] = LOCATIONS
    .filter(l => l.ores[ore] !== undefined)
    .map(l => ({loc: l, pct: l.ores[ore]}))
    .sort((a,b) => b.pct - a.pct);
});

let currentSys = 'All';
let currentMethod = 'All';
let currentView = 'location';
let searchQ = '';

function locMatchesMethod(loc) {
  if (currentMethod === 'All') return true;
  return methodFromType(loc.type) === currentMethod;
}

function miningMethodBadges(type) {
  if (type === 'Belt') return '<span class="mbadge mbadge-ship">Ship</span>';
  if (type === 'Cave') return '<span class="mbadge mbadge-hand">Hand</span>';
  return '<span class="mbadge mbadge-roc">ROC</span><span class="mbadge mbadge-hand">Hand</span>';
}

function sysBadgeClass(sys) {
  return sys === 'Stanton' ? 'badge-stanton' : sys === 'Pyro' ? 'badge-pyro' : 'badge-nyx';
}

function barColor(type) { return METHOD[methodFromType(type)].bar; }
function textColor(type) { return METHOD[methodFromType(type)].text; }

const SYS_COLOR = {
  Stanton: { bar: 'linear-gradient(90deg,#1a6090,#4fc3f7)', text: '#4fc3f7' },
  Pyro:    { bar: 'linear-gradient(90deg,#a04020,#ff9060)', text: '#ff9060' },
  Nyx:     { bar: 'linear-gradient(90deg,#602090,#c080ff)', text: '#c080ff' },
};

function orePrimaryMethodColor(entries) {
  const methods = new Set(entries.map(e => methodFromType(e.loc.type)));
  if (methods.size === 1) return METHOD[[...methods][0]].text;
  return '#e8e8e8';
}

function oreColors(oreName) {
  const entries = ORE_INDEX[oreName] || [];
  if (!entries.length) return { bar: 'linear-gradient(90deg,#3a3a3a,#666)', text: '#888' };
  const counts = { ship: 0, ground: 0, fps: 0 };
  entries.forEach(e => counts[methodFromType(e.loc.type)]++);
  const dominant = Object.entries(counts).sort((a,b) => b[1]-a[1])[0][0];
  return METHOD[dominant];
}

function renderByLocation(locs) {
  if (!locs.length) return '<div class="no-results">No locations match your filter.</div>';
  return '<div class="cards-grid">' + locs.map(loc => {
    const entries = Object.entries(loc.ores).sort((a,b) => b[1]-a[1]);
    const maxPct = entries[0][1];
    const rows = entries.map(([ore, pct]) => {
      const w = Math.round(pct / maxPct * 100);
      const mc = oreColors(ore);
      return `<div class="ore-row">
        <span class="ore-name" style="color:${mc.text}" title="${ore}">${ore}</span>
        <div class="ore-bar-wrap"><div class="ore-bar" style="width:${w}%;background:${mc.bar}"></div></div>
        <span class="ore-pct" style="color:${mc.text}">${pct}%</span>
      </div>`;
    }).join('');
    const sub = [loc.type, loc.sys, loc.b].filter(Boolean).join(' · ');
    return `<div class="card">
      <div class="card-header">
        <span class="card-name">${loc.n}</span>
        <span class="card-sub">${sub}</span>
      </div>
      ${rows}
    </div>`;
  }).join('') + '</div>';
}

function oreMethodBadges(entries) {
  const types = new Set(entries.map(e => e.loc.type));
  const badges = [];
  if (types.has('Belt')) badges.push('<span class="mbadge mbadge-ship">Ship</span>');
  if (types.has('Moon') || types.has('Planet')) {
    badges.push('<span class="mbadge mbadge-roc">ROC</span>');
    badges.push('<span class="mbadge mbadge-hand">Hand</span>');
  }
  if (types.has('Cave')) badges.push('<span class="mbadge mbadge-hand">Hand</span>');
  return [...new Set(badges)].join('');
}

function renderByOre(ores) {
  if (!ores.length) return '<div class="no-results">No ores match your filter.</div>';
  return ores.map(ore => {
    const entries = ORE_INDEX[ore].filter(e =>
      (currentSys === 'All' || e.loc.sys === currentSys) &&
      locMatchesMethod(e.loc)
    );
    if (!entries.length) return '';
    const maxPct = entries[0].pct;
    const nameCol = oreColors(ore).text;
    const rows = entries.map(e => {
      const w = Math.round(e.pct / maxPct * 100);
      const sc = SYS_COLOR[e.loc.sys] || SYS_COLOR.Stanton;
      const sub = [e.loc.type, e.loc.b].filter(Boolean).join(' · ');
      return `<tr>
        <td class="td-loc">${e.loc.n}<span class="td-body">${sub}</span></td>
        <td class="td-bar-cell"><div style="background:rgba(255,255,255,.06);border-radius:4px;height:10px;overflow:hidden"><div class="inline-bar" style="width:${w}%;background:${sc.bar}"></div></div></td>
        <td class="td-pct" style="color:${sc.text}">${e.pct}%</td>
      </tr>`;
    }).join('');
    return `<div class="ore-section">
      <div class="ore-section-header">
        <span class="ore-section-name" style="color:${nameCol}">${ore}</span>
        <span class="ore-count">${entries.length} location${entries.length!==1?'s':''}</span>
      </div>
      <table class="ore-table">
        <thead><tr>
          <th>Location</th><th style="width:120px">Spawn</th><th style="text-align:right">%</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).filter(Boolean).join('');
}

function getFilteredLocs() {
  const q = searchQ.toLowerCase();
  return LOCATIONS.filter(l => {
    if (currentSys !== 'All' && l.sys !== currentSys) return false;
    if (!locMatchesMethod(l)) return false;
    if (!q) return true;
    if (l.n.toLowerCase().includes(q)) return true;
    return Object.keys(l.ores).some(o => o.toLowerCase().includes(q));
  });
}

function getFilteredOres() {
  const q = searchQ.toLowerCase();
  return ALL_ORES.filter(ore => {
    const hasMatchingLoc = LOCATIONS.some(l =>
      l.ores[ore] !== undefined &&
      (currentSys === 'All' || l.sys === currentSys) &&
      locMatchesMethod(l)
    );
    if (!hasMatchingLoc) return false;
    if (q && !ore.toLowerCase().includes(q)) {
      return LOCATIONS.some(l =>
        l.ores[ore] !== undefined &&
        (currentSys === 'All' || l.sys === currentSys) &&
        locMatchesMethod(l) &&
        l.n.toLowerCase().includes(q)
      );
    }
    return true;
  });
}

function render() {
  const content = document.getElementById('content');
  if (currentView === 'location') {
    content.innerHTML = renderByLocation(getFilteredLocs());
  } else {
    content.innerHTML = renderByOre(getFilteredOres());
  }
}

// system tabs
document.getElementById('sys-tabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-sys]');
  if (!btn) return;
  currentSys = btn.dataset.sys;
  document.querySelectorAll('[data-sys]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

// method tabs
document.getElementById('method-tabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-method]');
  if (!btn) return;
  currentMethod = btn.dataset.method;
  document.querySelectorAll('[data-method]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

// view tabs
document.getElementById('view-tabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-view]');
  if (!btn) return;
  currentView = btn.dataset.view;
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

// search
document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  render();
});

render();
</script>
</body>
</html>
